# Managed by /etc/nixos/dots/kitty/kitty.conf.

include catppuccin-mocha.conf

# Nerd Font so the powerline separators render.
font_family JetBrainsMono Nerd Font
font_size 18
cursor_shape beam

# Powerline tab bar, on the bottom, matching the Catppuccin background.
tab_bar_edge bottom
tab_bar_background #1e1e2e
tab_bar_margin_color #1e1e2e
tab_bar_style powerline
tab_powerline_style angled
tab_bar_min_tabs 1

# macOS draws its own titlebar; make it follow the theme background.
macos_titlebar_color background
